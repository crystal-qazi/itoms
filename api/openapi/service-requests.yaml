openapi: 3.1.0
info:
  title: ITOMS Service Requests API
  version: 1.0.0-design
  description: >
    Design contract only. Authentication and CSRF are provided by the host
    Flask application. Every operation requires server-side capability and
    object-scope authorization. Actor/requester identity is session-derived.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /service-requests:
    get:
      operationId: listServiceRequests
      summary: List requests visible to the authenticated actor
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 120 }
        - in: query
          name: status_id
          schema: { type: integer, minimum: 1 }
        - in: query
          name: category_id
          schema: { type: integer, minimum: 1 }
        - in: query
          name: priority_id
          schema: { type: integer, minimum: 1 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Paginated visible requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createServiceRequest
      summary: Create a request for the current employee
      description: Requires service_request.create; requester is never client-selected.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /service-requests/{request_id}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: getServiceRequest
      summary: Get one request after object-scope authorization
      responses:
        '200':
          description: Request detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateServiceRequest
      summary: Update editable request fields using optimistic locking
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRequest' }
      responses:
        '200':
          description: Updated request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /service-requests/{request_id}/assignment:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    put:
      operationId: assignServiceRequest
      summary: Assign to a validated team and optional eligible employee
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                team_id: { type: [integer, 'null'], minimum: 1 }
                employee_id: { type: [integer, 'null'], minimum: 1 }
                version: { type: integer, minimum: 1 }
      responses:
        '200': { description: Assignment updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /service-requests/{request_id}/status:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: transitionServiceRequest
      summary: Apply an allowed configured status transition
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status_id, version]
              additionalProperties: false
              properties:
                status_id: { type: integer, minimum: 1 }
                reason: { type: string, maxLength: 1000 }
                version: { type: integer, minimum: 1 }
      responses:
        '200': { description: Transition recorded }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /service-requests/{request_id}/comments:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: listServiceRequestComments
      summary: List comments visible on the authorized request
      responses:
        '200': { description: Comments }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addServiceRequestComment
      summary: Add a plain-text comment as the current employee
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        '201': { description: Comment created }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
  parameters:
    RequestId:
      in: path
      name: request_id
      required: true
      schema: { type: integer, minimum: 1 }
    CsrfHeader:
      in: header
      name: X-CSRFToken
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    CreateRequest:
      type: object
      additionalProperties: false
      required: [title, description, category_id, priority_id]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 20000 }
        category_id: { type: integer, minimum: 1 }
        priority_id: { type: integer, minimum: 1 }
    UpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 20000 }
        category_id: { type: integer, minimum: 1 }
        priority_id: { type: integer, minimum: 1 }
        version: { type: integer, minimum: 1 }
    ServiceRequest:
      type: object
      required: [id, request_key, title, status_id, version, created_at]
      properties:
        id: { type: integer }
        request_key: { type: string, pattern: '^SR-[0-9]{8}$' }
        title: { type: string }
        description: { type: string }
        category_id: { type: integer }
        priority_id: { type: integer }
        status_id: { type: integer }
        requester_employee_id: { type: integer }
        assigned_team_id: { type: [integer, 'null'] }
        assigned_employee_id: { type: [integer, 'null'] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RequestPage:
      type: object
      required: [items, page, per_page, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ServiceRequest' }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
  responses:
    Unauthorized:
      description: Authentication required
    Forbidden:
      description: Operation not permitted
    NotFound:
      description: Resource not found or not visible
    Conflict:
      description: Version or workflow conflict
    ValidationError:
      description: Invalid request fields
